<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        .msg{
            margin-bottom: 1rem;
            font-size: small;
            color: red;
        }
    </style>
</head>
<body>
    <h2>Register</h2>
    <div class="msg">{{ message }}</div>
    <form action="/register" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autocomplete="off" autofocus>
        <br><br>
        <label for="password" >Password:</label>
        <input type="password" id="password" name="password" required autocomplete="off" autofocus>
        <br><br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm_password" required autocomplete="off" autofocus>
        <br><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</body>
</html>
